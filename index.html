    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dolancer. Get paid for what you are already good at." />

      name="twitter:description"
      content="Fixed-price tasks, supervisor-assigned offers, supervisor review. No public marketplace, no client contact."

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&display=swap"
      rel="stylesheet"
    />

    <title>Dolancer. Get paid for what you are already good at.</title>
    <style>
      /* Pre-paint stage: separate alphabets rising, mirroring the React boot
         sequence so the handoff is invisible. Pure CSS, no dependencies. */
      html { background: #060D0A; }
      #boot-splash {
        position: fixed; inset: 0; z-index: 9998;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 22px; overflow: hidden;
        background: #060D0A;
      }
      #boot-splash .boot-letters {
        display: flex;
        overflow: hidden;
        padding-bottom: 0.06em;
        font-family: "Bricolage Grotesque", system-ui, -apple-system, sans-serif;
        font-weight: 800;
        font-size: clamp(3.6rem, 14vw, 10rem);
        line-height: 0.9;
        letter-spacing: -0.02em;
        color: #F3EFE3;
      }
      #boot-splash .boot-letters span {
        display: inline-block;
        transform: translateY(115%);
        animation: boot-rise 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        animation-delay: calc(0.05s + var(--i) * 0.045s);
      }
      @keyframes boot-rise {
        to { transform: translateY(0); }
      }
      #boot-splash .boot-sub {
        font-family: ui-monospace, monospace;
        font-size: 11px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: rgba(127, 227, 166, 0.9);
        opacity: 0;
        animation: boot-fade 0.5s ease forwards;
        animation-delay: 0.55s;
      }
      @keyframes boot-fade {
        to { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .boot-letters span { animation: none; transform: none; }
        #boot-splash .boot-sub { animation: none; opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-splash" role="status" aria-label="Loading Dolancer">
      <div class="boot-letters" aria-hidden="true"><span style="--i:0">D</span><span style="--i:1">O</span><span style="--i:2">L</span><span style="--i:3">A</span><span style="--i:4">N</span><span style="--i:5">C</span><span style="--i:6">E</span><span style="--i:7">R</span></div>
      <div class="boot-sub" aria-hidden="true">Routed work · No bidding</div>
    </div>
    <noscript><style>#boot-splash { display: none; }</style></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
